name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: validate skills (hmrbot rules)
        run: pnpm validate

      - name: registry.json is up to date
        run: |
          pnpm build:registry
          git diff --exit-code registry.json \
            || (echo "::error::registry.json is stale — run 'pnpm build:registry' and commit"; exit 1)

      - name: site builds
        run: pnpm --filter @hmrbot/hub-site build

      - name: cli typechecks + builds
        run: |
          pnpm --filter hmrbot typecheck
          pnpm --filter hmrbot build

  skills-ref:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory; pnpm validate is the gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref
      - name: validate against the agentskills.io spec
        run: |
          for d in content/skills/*/; do
            [ "$(basename "$d")" = "_template" ] && continue
            echo "== $d"
            skills-ref validate "$d"
          done
