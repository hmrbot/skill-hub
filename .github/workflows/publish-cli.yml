name: publish-cli

# Publishes cli/ to npm as `hmrbot`.
#
# Auth = npm Trusted Publishing (OIDC) — NO token, NO NPM_TOKEN secret.
# One-time setup (see Response doc "انتشار CLI روی npm"):
#   1. publish v0.1.0 once manually from your machine (`npm publish` in cli/)
#   2. npmjs.com -> package `hmrbot` -> Settings -> Trusted Publisher:
#      GitHub Actions / owner: hmrbot / repo: skill-hub / workflow: publish-cli.yml
# After that this workflow publishes every version bump on its own.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — required for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node ships older.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./cli/package.json').name")
          VER=$(node -p "require('./cli/package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "will publish $NAME@$VER"
          fi

      - name: build + typecheck
        if: steps.check.outputs.published == 'false'
        run: |
          pnpm --filter hmrbot typecheck
          pnpm --filter hmrbot build

      - name: publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public
        working-directory: cli
