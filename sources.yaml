# Federation config for `pnpm build:registry`.
#
# Only name, description and license are pulled from external sources — no skill
# content is copied here. The CLI downloads federated skills straight from
# upstream at install time.
#
# license_policy:
#   repo       -> whole repo shares one license (field: license)
#   per-skill  -> read each skill folder's LICENSE.txt / LICENSE and classify it
# A skill whose license is not in license_allow (or is in `exclude`) is dropped
# and logged.

version: 1

sections:
  skill:
    sources:
      - id: hmrbot
        type: local
        path: content/skills/

      - id: anthropic
        type: github
        repo: anthropics/skills
        ref: main
        path: skills/
        license_policy: per-skill
        license_allow: [Apache-2.0, MIT]
        exclude: [pdf, docx, pptx, xlsx] # (c) all rights reserved
        enabled: true

      - id: microsoft
        type: github
        repo: microsoft/skills
        ref: main
        path: .github/plugins/ # real skill dirs live here; .github/skills/* are symlinks
        license_policy: repo
        license: MIT
        # ~180 Azure-SDK-specific skills — would bury the catalog. Federation
        # works for it (tested); flip to true and add an `include:` allowlist
        # if you want a curated subset.
        enabled: false

      - id: openai
        type: github
        repo: openai/codex
        ref: main
        path: "" # skills path to be confirmed
        license_policy: per-skill
        license_allow: [Apache-2.0, MIT]
        enabled: false
